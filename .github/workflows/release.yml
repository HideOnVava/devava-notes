# Builds Devava Notes for Windows, smoke-tests the installer on a real desktop session
# (screenshots are kept as artifacts) and publishes it as a GitHub release.
#
# Triggered by pushing a version tag such as v1.1.0 (it must match the version in pom.xml
# and have a section in CHANGELOG.md). Running it by hand from the Actions tab is a dry run:
# everything is built and tested and the files are kept as workflow artifacts, but no release
# is created.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check that the tag matches the version in pom.xml
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's/^    <version>\(.*\)<\/version>$/\1/p' pom.xml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the pom.xml version $version."; exit 1
          fi

      - name: Run the tests
        run: ./mvnw.cmd -B verify

      - name: Build the release files
        run: .\packaging\release.ps1

      - name: Show what was built
        shell: bash
        run: ls -l dist/release && cat dist/release/SHA256SUMS.txt

      - name: Smoke test
        run: .\tools\smoke\smoke-windows.ps1 -Setup (Get-Item dist\release\*-setup.exe).FullName -Out target\smoke\out

      - name: Keep the screenshots and the log of the smoke test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-windows-x64
          path: target/smoke/out
          if-no-files-found: ignore

      - name: Keep the release files
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/release

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/Devava-Notes-* dist/release/SHA256SUMS.txt \
            --title "Devava Notes ${GITHUB_REF_NAME#v}" \
            --notes-file dist/release/RELEASE_NOTES.md \
            --verify-tag
